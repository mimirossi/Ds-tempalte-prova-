name: Deploy to GitHub Pages

# Every push to main rebuilds the page list and republishes the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the page list
        run: node scripts/build-manifest.mjs
      - name: Turn tokens into CSS variables
        run: node scripts/build-tokens.mjs
      - name: List the preview fonts
        run: node scripts/build-fonts.mjs
      - name: Mark the site as built
        run: echo "{\"commit\":\"$GITHUB_SHA\"}" > build.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
