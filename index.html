<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design System</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317171a'/%3E%3Ctext x='16' y='21' font-family='system-ui' font-size='13' font-weight='700' text-anchor='middle' fill='white'%3EDS%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="app/theme.css" />
    <link rel="stylesheet" href="app/styles.css" />
    <script>
      // Apply the saved theme before first paint.
      try {
        var t = localStorage.getItem("ds-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <a class="brand" href="#/">
        <span class="brand-badge" id="brand-badge">DS</span>
        <span id="brand-title">Design System</span>
      </a>
      <div class="topbar-actions">
        <button class="pill-btn" id="edit-toggle" aria-pressed="true" title="Show or hide placeholders and edit links">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
          <span>Edit mode</span>
        </button>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" /></svg>
        </button>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input type="search" id="search" placeholder="Search pages" aria-label="Search pages" />
        </div>
        <nav id="nav" aria-label="Pages"></nav>
        <div class="sidebar-edit edit-only" id="new-page"></div>
      </aside>

      <main class="main" id="main">
        <div class="page">
          <article class="article" id="article"><p class="muted">Loading…</p></article>
          <aside class="toc" id="toc" aria-label="On this page"></aside>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app/vendor/marked.umd.js"></script>
    <script src="app/vendor/highlight.min.js"></script>
    <script src="app/app.js"></script>
  </body>
</html>
